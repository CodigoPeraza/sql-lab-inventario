services:
  db:
    image: mariadb:11.4
    container_name: sql-lab-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-inventario}
      MARIADB_USER: ${MARIADB_USER:-inventario_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-apppass}
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
